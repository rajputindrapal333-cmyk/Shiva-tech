<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>पूरा वीडियो देखें | Shiva Tech</title>
  <meta name="description" content="वीडियो देखने के लिए नीचे क्लिक करें।">

  <link rel="preload" as="image" href="thumbnail.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      background: #080b14;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 15px;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .card {
      width: 100%;
      overflow: hidden;
      border-radius: 22px;
      background: #151927;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.45);
    }

    .thumbnail {
      display: block;
      width: 100%;
      height: auto;
      max-height: 610px;
      object-fit: cover;
      background: #202536;
    }

    .content {
      padding: 23px 18px 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 800;
    }

    .description {
      margin: 0 0 21px;
      color: #b7becd;
      font-size: 14px;
      line-height: 1.6;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      border-radius: 13px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff3152, #d91538);
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 7px 22px rgba(255, 49, 82, 0.28);
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.98);
    }

    .play-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #ffffff;
      color: #d91538;
      font-size: 14px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 15px;
      color: #858da1;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 360px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .content {
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="brand">SHIVA TECH</div>

    <section class="card">
      <img
        class="thumbnail"
        src="thumbnail.png"
        alt="वीडियो देखने के लिए क्लिक करें"
        width="860"
        height="1290"
        fetchpriority="high"
        decoding="async"
      >

      <div class="content">
        <h1>पूरा वीडियो देखने के लिए नीचे क्लिक करें</h1>

        <p class="description">
          वीडियो देखने के लिए नीचे दिए गए बटन पर क्लिक करें।
        </p>

        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/inbfnexb4?key=46e9ed39c1b72d9f0a79b10cd80cdd34"
          target="_blank"
          rel="nofollow sponsored noopener"
        >
          <span class="play-icon">▶</span>
          यहाँ क्लिक करें
        </a>
      </div>
    </section>

    <div class="footer">
      Sponsored content
    </div>
  </main>
</body>
</html>
