<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Explore featured video content.">
  <title>Featured Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f5f8;
      color: #171717;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      height: auto;
      max-height: 540px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 28px 22px 30px;
    }

    .label {
      color: #e83d83;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .description {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      background: #e83d83;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 480px) {
      .page {
        padding: 12px;
      }

      .content {
        padding: 24px 18px 26px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <!-- Apni original photo ka naam girl.jpg rakho -->
      <img
        class="photo"
        src="girl.jpg"
        alt="Featured content"
        width="430"
        height="538"
      >

      <div class="content">

        <div class="label">FEATURED VIDEO</div>

        <h1>
          Pura video dekhne ke liye neeche click kare 👇
        </h1>

        <p class="description">
          Explore the featured video content below.
        </p>

        <!-- Apna actual video URL yahan lagao -->
        <a
          class="button"
          href="https://example.com"
          rel="noopener noreferrer"
        >
          Continue to Video →
        </a>

        <div class="footer">
          Please visit only content you wish to view.
        </div>

      </div>
    </section>
  </main>

</body>
</html>
