<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>खास वीडियो ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: #fff;
      min-height: 100vh;
      padding: 15px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .card {
      width: 100%;
      overflow: hidden;
      border-radius: 20px;
      background: #171725;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    /* FULL POSTER — CROP NAHI HOGA */
    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .content {
      padding: 24px 18px 28px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .title span {
      display: block;
      color: #ff75b5;
      margin-top: 5px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff4f9a, #d92878);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 6px 20px rgba(255, 79, 154, 0.3);
    }

    .button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 16px;
      color: #aaaabd;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      .content {
        padding: 20px 14px 24px;
      }

      .title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <!-- Tumhari original full poster photo -->
      <img
        class="poster"
        src="./girl.jpg"
        alt="वीडियो पोस्टर"
        width="1024"
        height="1536"
      >

      <!-- Neeche separate button -->
      <div class="content">

        <h1 class="title">
          खास वीडियो देखने के लिए
          <span>नीचे क्लिक करें 👇</span>
        </h1>

        <!-- Adsterra Smartlink -->
        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/inbfnexb4?key=46e9ed39c1b72d9f0a79b10cd80cdd34"
          rel="noopener noreferrer"
        >
          वीडियो देखें →
        </a>

        <p class="note">
          आगे बढ़ने से पहले लिंक की सामग्री और
          लागू आयु-प्रतिबंधों की जानकारी देखें।
        </p>

      </div>

    </section>

  </main>

</body>
</html>
