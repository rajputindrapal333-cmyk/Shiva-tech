<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>खास वीडियो ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: white;
      min-height: 100vh;
      padding: 15px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .card {
      background: #171725;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    /* Full poster — crop nahi hoga */
    .poster {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .content {
      padding: 24px 18px 26px;
      text-align: center;
    }

    h1 {
      font-size: 25px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    h1 span {
      color: #ff75b5;
      display: block;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff4f9a, #d92878);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(.98);
    }

    .note {
      color: #aaaabd;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <!-- Tumhari original poster photo -->
      <img
        class="poster"
        src="./girl.jpg"
        alt="वीडियो का पोस्टर"
        width="1024"
        height="1536"
      >

      <div class="content">

        <h1>
          खास वीडियो देखने के लिए
          <span>नीचे क्लिक करें 👇</span>
        </h1>

        <!-- Adsterra Smartlink -->
        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/inbfnexb4?key=46e9ed39c1b72d9f0a79b10cd80cdd34"
          rel="noopener noreferrer"
        >
          वीडियो देखें →
        </a>

        <p class="note">
          आगे बढ़ने से पहले लिंक की सामग्री और
          लागू आयु-प्रतिबंधों की जानकारी देखें।
        </p>

      </div>

    </section>

  </main>

</body>
</html>
