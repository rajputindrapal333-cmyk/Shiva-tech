<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="खास वीडियो और मनोरंजन सामग्री देखें।">
  <title>खास वीडियो ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, Arial, sans-serif;
      background: #0b0b16;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .card {
      overflow: hidden;
      border-radius: 22px;
      background: #171725;
      box-shadow: 0 10px 45px rgba(0,0,0,.4);
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .content {
      padding: 28px 20px 25px;
      text-align: center;
    }

    .label {
      color: #ff9bc5;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.4;
      font-weight: 800;
      margin-bottom: 22px;
    }

    h1 span {
      display: block;
      color: #ff83bb;
      margin-top: 5px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff4f9a, #d92878);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 7px 22px rgba(255,79,154,.3);
    }

    .button:active {
      transform: scale(.98);
    }

    .note {
      margin-top: 18px;
      color: #aaaabd;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <!-- Tumhari poster wali original pic -->
      <img
        class="photo"
        src="girl.jpg"
        alt="खास वीडियो"
        width="1024"
        height="1024"
      >

      <div class="content">

        <div class="label">♡ एक्सक्लूसिव वीडियो ♡</div>

        <h1>
          पूरा वीडियो देखने के लिए
          <span>नीचे क्लिक करें 👇</span>
        </h1>

        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/inbfnexb4?key=46e9ed39c1b72d9f0a79b10cd80cdd34"
          rel="noopener noreferrer"
        >
          वीडियो देखें →
        </a>

        <p class="note">
          आगे बढ़ने से पहले सुनिश्चित करें कि आप
          लिंक की सामग्री देखना चाहते हैं।
        </p>

      </div>
    </section>
  </main>

</body>
</html>
